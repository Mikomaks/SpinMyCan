name: Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Xcode version
      run: xcodebuild -version
    - name: Build (simulator, no-sign)
      run: |
        xcodebuild build \
          -project MySpin.xcodeproj \
          -scheme MySpin \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO
  release:
      if: github.event_name == 'push'
      needs: build
      permissions:
        contents: write   # needed to create tags and releases
      runs-on: ubuntu-latest   # Linux is enough, nothing is built here
      steps:
      - uses: actions/checkout@v7
  
      - name: Read app version from the Xcode project
        id: ver
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' MySpin.xcodeproj/project.pbxproj \
                    | sed -E 's/.*= ([0-9.]+);/\1/')
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  
      - name: Create the release if this version doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists, skipping"
          else
            gh release create "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --generate-notes
          fi

