name: iOS build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Xcode version
      run: xcodebuild -version
    - name: Build (simulator, no-sign)
      run: |
        xcodebuild build \
          -project MySpin.xcodeproj \
          -scheme MySpin \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO
