# Sprawdza, czy apka i rozszerzenia się kompilują (symulator, bez podpisu).
name: iOS build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v4
    - name: Xcode version
      run: xcodebuild -version
    - name: Build (simulator, bez podpisu)
      run: |
        xcodebuild build \
          -project MySpin.xcodeproj \
          -alltargets \
          -configuration Debug \
          -sdk iphonesimulator \
          CODE_SIGNING_ALLOWED=NO
