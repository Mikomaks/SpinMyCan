; Mostek CAN -> BLE dla MySpin.
; Płytka: Waveshare ESP32-S3-RS485-CAN (SKU 32154).
; USB jest natywne (GPIO19/20, bez układu USB-UART), stąd flagi CDC.

[env:waveshare-s3-can]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; DIO działa z każdą kością flash; QIO zależy od konkretnego egzemplarza.
board_build.flash_mode = dio
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; Diagnostyka na biurku — nie wgrywać na motocykl.
[env:txtest]
extends = env:waveshare-s3-can
build_flags =
    ${env:waveshare-s3-can.build_flags}
    -DTX_FLOAT_TEST

; Sztuczna szyna do testów na biurku — nie wgrywać na motocykl. Sterownik CAN nie startuje.
[env:fakebus]
extends = env:waveshare-s3-can
build_flags =
    ${env:waveshare-s3-can.build_flags}
    -DFAKE_BUS

; Programy do sprawdzania aktualizacji przez Bluetooth na biurku — nie zostawiać na płytce.
; otatest: zwykły program z innym numerem wersji (98) (udana aktualizacja ma go pokazać).
[env:otatest]
extends = env:waveshare-s3-can
build_flags =
    ${env:waveshare-s3-can.build_flags}
    -DFW_VERSION_OVERRIDE=98

; otabad: nigdy nie potwierdza samego siebie — po restarcie układ ma wrócić do poprzedniego.
[env:otabad]
extends = env:waveshare-s3-can
build_flags =
    ${env:waveshare-s3-can.build_flags}
    -DFW_VERSION_OVERRIDE=99
    -DOTA_NEVER_CONFIRM
